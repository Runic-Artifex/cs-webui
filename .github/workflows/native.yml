name: Native WebUI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  WEBVIEW2_SDK_VERSION: 1.0.4078.44
  # Oldest macOS release supported by .NET 10. Every shipped dylib must record
  # this minimum (LC_BUILD_VERSION minos) or older.
  MACOS_DEPLOYMENT_TARGET: "15.0"

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate pinned official WebUI source
    runs-on: ubuntu-24.04
    outputs:
      repository: ${{ steps.webui-revision.outputs.repository }}
      revision: ${{ steps.webui-revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v7

      - name: Read and validate pinned official WebUI revision
        id: webui-revision
        shell: bash
        run: |
          set -euo pipefail
          owner=$(jq -er '.nodes.webui.locked.owner | select(test("^[A-Za-z0-9_.-]+$"))' flake.lock)
          repository_name=$(jq -er '.nodes.webui.locked.repo | select(test("^[A-Za-z0-9_.-]+$"))' flake.lock)
          revision=$(jq -er '.nodes.webui.locked.rev | select(test("^[0-9a-f]{40}$"))' flake.lock)

          repository="$owner/$repository_name"
          manifest_repository=$(jq -er '.repository | select(test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))' eng/webui-nightly-assets.json)
          manifest_revision=$(jq -er '.commit | select(test("^[0-9a-f]{40}$"))' eng/webui-nightly-assets.json)

          if [[ "$manifest_repository" != "webui-dev/webui" ]]; then
            echo "The native asset manifest must select the official webui-dev/webui repository." >&2
            exit 1
          fi
          if [[ "$repository" != "$manifest_repository" || "$revision" != "$manifest_revision" ]]; then
            echo "flake.lock must pin the manifest's exact official WebUI repository and revision." >&2
            echo "flake.lock: $repository@$revision" >&2
            echo "manifest:   $manifest_repository@$manifest_revision" >&2
            exit 1
          fi

          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Check out pinned official WebUI source
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.webui-revision.outputs.repository }}
          ref: ${{ steps.webui-revision.outputs.revision }}
          path: .upstream/webui

      - name: Validate the raw ABI export surface
        shell: bash
        run: bash eng/validate-webui-abi.sh .upstream/webui/include/webui.h

  build:
    name: Source build verification (${{ matrix.rid }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            installed_library: lib/libwebui-2.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            installed_library: lib/libwebui-2.so
          - os: windows-2022
            rid: win-x64
            installed_library: bin/webui-2.dll
          - os: macos-15-intel
            rid: osx-x64
            installed_library: lib/libwebui-2.dylib
          - os: macos-15
            rid: osx-arm64
            installed_library: lib/libwebui-2.dylib
    steps:
      - uses: actions/checkout@v7

      - name: Check out pinned official WebUI source
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.revision }}
          path: .upstream/webui

      - name: Configure shared library
        run: >-
          cmake -S .upstream/webui -B native-build
          -DBUILD_SHARED_LIBS=ON
          -DWEBUI_BUILD_EXAMPLES=OFF
          -DWEBUI_OUT_LIB_NAME=webui-2
          -DWEBUI_USE_TLS=OFF
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.MACOS_DEPLOYMENT_TARGET }}

      - name: Build shared library
        run: cmake --build native-build --config Release --parallel

      - name: Install shared library
        run: cmake --install native-build --prefix native-install --config Release

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run native lifecycle regression against the source build
        env:
          CSWEBUI_NATIVE_LIBRARY: ${{ github.workspace }}/native-install/${{ matrix.installed_library }}
        run: >-
          dotnet test tests/CsWebUi.Tests/CsWebUi.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~WebUiNativeSmokeTests|FullyQualifiedName~WebUiWindowSmokeTests|FullyQualifiedName~WebUiFileHandlerTests"

      # The official macOS nightly archives are built on the newest runner
      # image without a deployment target, so they require the newest macOS.
      # Package macOS dylibs built from the same pinned official commit with
      # upstream's own release recipe instead, targeting the .NET 10 floor.
      - name: Build packaged macOS library with the upstream release recipe
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ env.MACOS_DEPLOYMENT_TARGET }}
        run: |
          set -euo pipefail
          case "${{ matrix.rid }}" in
            osx-arm64) arch=arm64 ;;
            osx-x64) arch=x86_64 ;;
            *) echo "Unexpected macOS RID '${{ matrix.rid }}'." >&2; exit 1 ;;
          esac

          xcrun --show-sdk-version
          clang --version
          # Overriding TARGET pins the triple's deployment target explicitly.
          # Building against this runner's SDK fails if WebKit or AppKit usage
          # needs an SDK newer than the image provides; unguarded use of APIs
          # newer than the deployment target is an error.
          make -C .upstream/webui release \
            TARGET="-target ${arch}-apple-macos${MACOSX_DEPLOYMENT_TARGET} -arch ${arch} -Werror=unguarded-availability-new"

          mkdir -p "macos-native/${{ matrix.rid }}"
          cp .upstream/webui/dist/libwebui-2.dylib "macos-native/${{ matrix.rid }}/libwebui-2.dylib"

      - name: Verify macOS minimum OS with vtool
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for library in native-install/${{ matrix.installed_library }} "macos-native/${{ matrix.rid }}/libwebui-2.dylib"; do
            echo "== $library"
            vtool -show-build "$library"
            otool -L "$library"
          done
          node eng/check-macos-minos.mjs --max "$MACOS_DEPLOYMENT_TARGET" \
            native-install/${{ matrix.installed_library }} "macos-native/${{ matrix.rid }}/libwebui-2.dylib"

      - name: Run native lifecycle regression against the packaged macOS library
        if: runner.os == 'macOS'
        env:
          CSWEBUI_NATIVE_LIBRARY: ${{ github.workspace }}/macos-native/${{ matrix.rid }}/libwebui-2.dylib
        run: >-
          dotnet test tests/CsWebUi.Tests/CsWebUi.Tests.csproj
          --configuration Release
          --filter "FullyQualifiedName~WebUiNativeSmokeTests|FullyQualifiedName~WebUiWindowSmokeTests|FullyQualifiedName~WebUiFileHandlerTests"

      - name: Upload packaged macOS library
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: webui-macos-native-${{ matrix.rid }}
          path: macos-native
          if-no-files-found: error

      - name: Configure static Windows library
        if: matrix.rid == 'win-x64'
        run: >-
          cmake -S .upstream/webui -B native-static-build
          -DBUILD_SHARED_LIBS=OFF
          -DBUILD_TESTING=OFF
          -DWEBUI_BUILD_EXAMPLES=OFF
          -DWEBUI_OUT_LIB_NAME=webui-2
          -DWEBUI_USE_TLS=OFF
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          -DCMAKE_C_FLAGS=/DWEBUI_WEBVIEW_STATIC
          -DCMAKE_CXX_FLAGS=/DWEBUI_WEBVIEW_STATIC

      - name: Build and install static Windows library
        if: matrix.rid == 'win-x64'
        run: |
          cmake --build native-static-build --config Release --parallel
          cmake --install native-static-build --prefix native-static-install --config Release

      - name: Verify Windows DLL has no dynamic MSVC runtime dependency
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $dumpbin = Get-ChildItem "$visualStudio\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $dumpbin) {
            throw "Could not locate dumpbin.exe."
          }

          $dependencies = & $dumpbin.FullName /DEPENDENTS native-install/bin/webui-2.dll | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed with exit code $LASTEXITCODE."
          }

          Write-Output $dependencies
          if ($dependencies -match '(?im)^\s+(?:VCRUNTIME|MSVCP|api-ms-win-crt|ucrtbase).*\.dll\s*$') {
            throw "webui-2.dll dynamically depends on the MSVC/UCRT runtime."
          }

  official-assets:
    name: Bootstrap official nightly assets
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download and verify official WebUI binaries
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./eng/bootstrap-webui.sh artifacts

      - name: Acquire static WebView2 loader
        shell: bash
        run: |
          set -euo pipefail
          package_uri="https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/${WEBVIEW2_SDK_VERSION}/microsoft.web.webview2.${WEBVIEW2_SDK_VERSION}.nupkg"
          package_path="$RUNNER_TEMP/microsoft.web.webview2.nupkg"
          package_root="$RUNNER_TEMP/microsoft.web.webview2"
          curl -fsSL "$package_uri" -o "$package_path"
          unzip -q "$package_path" -d "$package_root"

          loader="$package_root/build/native/x64/WebView2LoaderStatic.lib"
          if [[ ! -f "$loader" ]]; then
            echo "The WebView2 SDK package did not contain the x64 static loader." >&2
            exit 1
          fi

          cp "$loader" artifacts/native-static/win-x64/WebView2LoaderStatic.lib

      - name: Upload verified official native assets
        uses: actions/upload-artifact@v7
        with:
          name: webui-official-native
          path: |
            artifacts/native
            artifacts/native-static
            artifacts/include
            artifacts/webui-nightly-assets.json
            artifacts/webui-nightly-release.json
            artifacts/webui-nightly-commit.txt
          if-no-files-found: error

      - name: Retain exact official archives and provenance
        uses: actions/upload-artifact@v7
        with:
          name: webui-official-archives
          path: |
            artifacts/official-archives
            artifacts/include
            artifacts/webui-nightly-assets.json
            artifacts/webui-nightly-release.json
            artifacts/webui-nightly-commit.txt
          if-no-files-found: error

  package:
    name: Pack NuGet runtime assets
    needs: [prepare, build, official-assets]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: webui-official-native
          path: artifacts

      - name: Download macOS libraries built for the supported floor
        uses: actions/download-artifact@v8
        with:
          pattern: webui-macos-native-*
          path: macos-native
          merge-multiple: true

      - name: Replace official macOS libraries and record provenance
        shell: bash
        env:
          WEBUI_REPOSITORY: ${{ needs.prepare.outputs.repository }}
          WEBUI_REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          set -euo pipefail
          entries=()
          for rid in osx-arm64 osx-x64; do
            library="macos-native/$rid/libwebui-2.dylib"
            if [[ ! -f "$library" ]]; then
              echo "Missing source-built $rid WebUI library." >&2
              exit 1
            fi
            cp "$library" "artifacts/native/$rid/libwebui-2.dylib"
            sha256=$(sha256sum "$library" | cut -d' ' -f1)
            entries+=("$(jq -n --arg rid "$rid" --arg sha256 "$sha256" '{rid: $rid, library: "libwebui-2.dylib", sha256: $sha256}')")
          done

          mkdir -p artifacts/native-provenance
          printf '%s\n' "${entries[@]}" | jq -s \
            --arg repository "$WEBUI_REPOSITORY" \
            --arg commit "$WEBUI_REVISION" \
            --arg deploymentTarget "$MACOS_DEPLOYMENT_TARGET" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{repository: $repository, commit: $commit, recipe: "GNUmakefile release", deploymentTarget: $deploymentTarget, workflowRun: $run, assets: .}' \
            > artifacts/native-provenance/webui-macos-source-build.json
          cat artifacts/native-provenance/webui-macos-source-build.json

      - name: Check macOS minimum OS of native inputs
        run: node eng/check-macos-minos.mjs --max "$MACOS_DEPLOYMENT_TARGET" artifacts/native

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CsWebUi.sln

      - name: Run tests against the native library
        env:
          CSWEBUI_NATIVE_LIBRARY: ${{ github.workspace }}/artifacts/native/linux-x64/libwebui-2.so
        run: dotnet test CsWebUi.sln --configuration Release --no-restore

      - name: Publish and run the NativeAOT smoke test
        shell: bash
        run: |
          dotnet publish samples/CsWebUi.NativeAotSmoke/CsWebUi.NativeAotSmoke.csproj \
            --configuration Release --runtime linux-x64 --self-contained true --output artifacts/native-aot
          CSWEBUI_NATIVE_LIBRARY=artifacts/native/linux-x64/libwebui-2.so artifacts/native-aot/CsWebUi.NativeAotSmoke

      - name: Pack native package
        run: >-
          dotnet pack src/CsWebUi.Native/CsWebUi.Native.csproj
          --configuration Release --no-restore --output artifacts/packages
          -p:NativeAssetsRoot=${{ github.workspace }}/artifacts/native
          -p:StaticNativeAssetsRoot=${{ github.workspace }}/artifacts/native-static
          -p:NativeProvenanceRoot=${{ github.workspace }}/artifacts/native-provenance
          -p:RequireNativeAssets=true

      - name: Check macOS minimum OS of packaged dylibs
        shell: bash
        run: |
          set -euo pipefail
          package=$(find artifacts/packages -name 'CsWebUi.Native.*.nupkg' ! -name '*.snupkg' -print -quit)
          if [[ -z "$package" ]]; then
            echo "CsWebUi.Native package was not produced." >&2
            exit 1
          fi
          extracted="$RUNNER_TEMP/cswebui-native-package"
          rm -rf "$extracted"
          unzip -q "$package" 'runtimes/osx-*/native/*' -d "$extracted"
          node eng/check-macos-minos.mjs --max "$MACOS_DEPLOYMENT_TARGET" "$extracted/runtimes"
          unzip -l "$package" provenance/WebUI/webui-macos-source-build.json

      - name: Pack high-level package
        run: >-
          dotnet pack src/CsWebUi/CsWebUi.csproj
          --configuration Release --no-restore --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error

  dynamic-package-smoke:
    name: Dynamic package smoke (${{ matrix.rid }})
    needs: package
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            native_library: libwebui-2.so
            executable: CsWebUi.StaticPackageSmoke
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            native_library: libwebui-2.so
            executable: CsWebUi.StaticPackageSmoke
          - os: windows-2022
            rid: win-x64
            native_library: webui-2.dll
            executable: CsWebUi.StaticPackageSmoke.exe
          - os: macos-15-intel
            rid: osx-x64
            native_library: libwebui-2.dylib
            executable: CsWebUi.StaticPackageSmoke
          - os: macos-15
            rid: osx-arm64
            native_library: libwebui-2.dylib
            executable: CsWebUi.StaticPackageSmoke
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Restore package consumer
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(dotnet msbuild src/CsWebUi.Native/CsWebUi.Native.csproj -getProperty:PackageVersion -nologo | tr -d '\r')
          if [[ -z "$package_version" ]]; then
            echo "Could not determine the CsWebUi.Native package version." >&2
            exit 1
          fi

          dotnet restore tests/CsWebUi.StaticPackageSmoke/CsWebUi.StaticPackageSmoke.csproj \
            --runtime ${{ matrix.rid }} \
            -p:CsWebUiPackageVersion="$package_version" \
            --configfile tests/CsWebUi.StaticPackageSmoke/NuGet.config

      - name: Publish and run dynamically linked consumer
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(dotnet msbuild src/CsWebUi.Native/CsWebUi.Native.csproj -getProperty:PackageVersion -nologo | tr -d '\r')
          output=artifacts/dynamic-package-smoke

          dotnet publish tests/CsWebUi.StaticPackageSmoke/CsWebUi.StaticPackageSmoke.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            --no-restore \
            --output "$output" \
            -p:CsWebUiPackageVersion="$package_version"

          native_library="$output/${{ matrix.native_library }}"
          if [[ ! -f "$native_library" ]]; then
            echo "The default dynamic publish did not contain ${{ matrix.native_library }}." >&2
            exit 1
          fi

          "$output/${{ matrix.executable }}"

      - name: Verify packaged macOS minimum OS with vtool
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          library="artifacts/dynamic-package-smoke/${{ matrix.native_library }}"
          vtool -show-build "$library"
          node eng/check-macos-minos.mjs --max "$MACOS_DEPLOYMENT_TARGET" "$library"

      - name: Verify official Windows DLL dependencies
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $library = Join-Path $PWD "artifacts/dynamic-package-smoke/webui-2.dll"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $dumpbin = Get-ChildItem "$visualStudio\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $dumpbin) {
            throw "Could not locate dumpbin.exe."
          }

          $dependencies = & $dumpbin.FullName /DEPENDENTS $library | Out-String
          Write-Output $dependencies
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin failed with exit code $LASTEXITCODE."
          }

          if ($dependencies -match '(?im)^\s+(?:VCRUNTIME|MSVCP|api-ms-win-crt|ucrtbase).*\.dll\s*$') {
            throw "The official WebUI DLL dynamically depends on the MSVC/UCRT runtime."
          }

  static-package-smoke:
    name: Static package smoke (win-x64)
    needs: package
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Restore package consumer
        shell: pwsh
        run: |
          $packageVersion = dotnet msbuild src/CsWebUi.Native/CsWebUi.Native.csproj -getProperty:PackageVersion -nologo
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($packageVersion)) {
            throw "Could not determine the CsWebUi.Native package version."
          }

          dotnet restore tests/CsWebUi.StaticPackageSmoke/CsWebUi.StaticPackageSmoke.csproj `
            --runtime win-x64 `
            -p:CsWebUiPackageVersion=$packageVersion `
            --configfile tests/CsWebUi.StaticPackageSmoke/NuGet.config
          if ($LASTEXITCODE -ne 0) {
            throw "Package consumer restore failed."
          }

      - name: Publish and run statically linked consumer
        shell: pwsh
        run: |
          $packageVersion = dotnet msbuild src/CsWebUi.Native/CsWebUi.Native.csproj -getProperty:PackageVersion -nologo
          $output = Join-Path $PWD "artifacts/static-package-smoke"

          dotnet publish tests/CsWebUi.StaticPackageSmoke/CsWebUi.StaticPackageSmoke.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $output `
            -p:CsWebUiPackageVersion=$packageVersion `
            -p:CsWebUiStaticLink=true
          if ($LASTEXITCODE -ne 0) {
            throw "Static package consumer publish failed."
          }

          & "$output/CsWebUi.StaticPackageSmoke.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Static package consumer failed with exit code $LASTEXITCODE."
          }

          if (Test-Path -LiteralPath "$output/webui-2.dll") {
            throw "The statically linked publish unexpectedly contains webui-2.dll."
          }
          if (Test-Path -LiteralPath "$output/WebView2Loader.dll") {
            throw "The statically linked publish unexpectedly contains WebView2Loader.dll."
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $dumpbin = Get-ChildItem "$visualStudio\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          $dependencies = & $dumpbin.FullName /DEPENDENTS "$output/CsWebUi.StaticPackageSmoke.exe" | Out-String
          Write-Output $dependencies
          if ($dependencies -match '(?im)^\s+(?:webui-2|WebView2Loader)\.dll\s*$') {
            throw "The statically linked executable still imports a WebUI DLL."
          }
