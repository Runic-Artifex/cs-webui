name: Nix

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          installer-version: 2.35.1

      - name: Check flake outputs
        run: nix flake check --accept-flake-config

      - name: Build native WebUI package
        run: nix build .#webui-native --accept-flake-config

      - name: Test managed bindings against pinned native source
        run: >-
          nix develop .#default --accept-flake-config -c
          xvfb-run -a dotnet test CsWebUi.sln --configuration Release
